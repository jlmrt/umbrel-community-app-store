version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_ID:-pebble-proxy}_admin_1
      APP_PORT: 3000
    networks:
      - default
      - admin_internal

  admin:
    image: ghcr.io/jlmrt/pebble-proxy:sha-07ad1d2@sha256:9c0867fc7826f2a30e575aa3edf4ef357601b98f3586884c18a0c9b0d3f4e283
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      ROLE: admin
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 3000
      DATA_DIR: /data
      APP_SEED: ${APP_SEED}
      UMBREL_APP_ID: ${APP_ID:-pebble-proxy}
      PUBLIC_BASE_URL: ${PEBBLE_PROXY_PUBLIC_BASE_URL:-}
      ALLOWED_PUBLIC_HOSTS: ${PEBBLE_PROXY_ALLOWED_HOSTS:-}
      NODE_ENV: production
    networks:
      - admin_internal
      - processing_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: ghcr.io/jlmrt/pebble-proxy:sha-07ad1d2@sha256:9c0867fc7826f2a30e575aa3edf4ef357601b98f3586884c18a0c9b0d3f4e283
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      ROLE: public
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: 8080
      DATA_DIR: /data
      APP_SEED: ${APP_SEED}
      PUBLIC_BASE_URL: ${PEBBLE_PROXY_PUBLIC_BASE_URL:-}
      ALLOWED_PUBLIC_HOSTS: ${PEBBLE_PROXY_ALLOWED_HOSTS:-}
      NODE_ENV: production
      NEEDLE_ROUTER_URL: http://needle:8090
    # Intentionally Docker-network-only. No API port is published on the Umbrel host.
    expose:
      - "8080"
    networks:
      - default
      - processing_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  needle:
    image: ghcr.io/jlmrt/pebble-proxy-needle:sha-07ad1d2@sha256:aac0c394c1e020662263cfed7b368625c54fb25f9422a1c5d2aeec1df74b6d4a
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
    expose:
      - "8090"
    networks:
      - processing_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  admin_internal:
    internal: true
  processing_internal:
    internal: true
